<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tales From The Creeps</title>
<style>
:root {
  --bg: #0a0d12;
  --surface: #111520;
  --surface2: #1a1f2e;
  --border: #2a2f42;
  --accent: #c0392b;
  --accent2: #e74c3c;
  --text: #e0e0e0;
  --muted: #7a8099;
  --dim: #4a5068;
  --gold: #f39c12;
  --green: #27ae60;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: Georgia, serif; min-height: 100vh; }

header {
  background: var(--surface); border-bottom: 2px solid var(--accent);
  padding: 18px 24px; display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 100;
}
header h1 { font-size: 1.4rem; letter-spacing: 1px; color: #fff; }
header h1 span { color: var(--accent2); }
.header-sub { font-size: 0.72rem; color: var(--muted); font-family: monospace; margin-top: 2px; }

.mode-tabs { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; }
.mode-tab {
  flex: 1; padding: 11px; text-align: center; cursor: pointer;
  font-size: 0.85rem; color: var(--muted); border-bottom: 2px solid transparent;
  transition: all 0.15s; user-select: none;
}
.mode-tab.active { color: var(--accent2); border-bottom-color: var(--accent); }
.mode-tab:hover:not(.active) { color: var(--text); }

/* ── Finder panel ── */
.finder-panel { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }
.finder-panel.hidden { display: none; }
.finder-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; font-family: monospace; letter-spacing: 0.5px; }
#episodeSelect {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 12px; color: var(--text); font-size: 0.9rem;
  outline: none; font-family: Georgia, serif; cursor: pointer;
}
#episodeSelect:focus { border-color: var(--accent); }
.finder-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.finder-row select {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 10px; color: var(--text); font-size: 0.85rem; outline: none; cursor: pointer;
}
.finder-row select:focus { border-color: var(--accent); }
#findBtn {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 9px 24px; cursor: pointer; font-size: 0.9rem; font-family: Georgia, serif;
  transition: background 0.15s;
}
#findBtn:hover { background: var(--accent2); }
#findBtn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Authors panel ── */
.authors-panel { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 10px; align-items: center; }
.authors-panel.hidden { display: none; }
.authors-panel .search-wrap { flex: 1; min-width: 160px; position: relative; }
.authors-panel .search-wrap input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 12px 8px 34px; color: var(--text); font-size: 0.9rem; outline: none;
}
.authors-panel .search-wrap input:focus { border-color: var(--accent); }
.authors-panel .search-wrap::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; }

.author-list { display: flex; flex-direction: column; gap: 10px; }
.author-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color 0.2s; }
.author-card:hover { border-color: var(--accent); }
.author-card-header { padding: 14px 16px; cursor: pointer; display: flex; gap: 14px; align-items: center; }
.author-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; color: var(--accent2); flex-shrink: 0; }
.author-avatar.has-stories { border-color: var(--accent); }
.author-card-meta { flex: 1; min-width: 0; }
.author-name { font-size: 1rem; color: #fff; font-weight: bold; margin-bottom: 5px; }
.author-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 0.72rem; font-family: monospace; padding: 2px 8px; border-radius: 3px; }
.badge-ep { background: rgba(192,57,43,0.2); color: var(--accent2); border: 1px solid rgba(192,57,43,0.4); }
.badge-stories { background: rgba(39,174,96,0.15); color: var(--green); border: 1px solid rgba(39,174,96,0.3); }
.badge-none { background: var(--surface2); color: var(--dim); border: 1px solid var(--border); }
.episode-list { font-size: 0.75rem; color: var(--muted); margin-top: 5px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.author-stories { display: none; border-top: 1px solid var(--border); }
.author-card.open .author-stories { display: block; }
.author-card.open .chevron { transform: rotate(180deg); }
.no-stories-msg { padding: 20px 18px; color: var(--dim); font-size: 0.85rem; font-style: italic; }

/* ── Browse panel ── */
.browse-panel { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.browse-panel.hidden { display: none; }
.search-wrap { flex: 1; min-width: 180px; position: relative; }
.search-wrap input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 12px 8px 34px; color: var(--text);
  font-size: 0.9rem; outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; }
.pill-group { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.pill-group button {
  background: none; border: none; color: var(--muted); padding: 8px 12px;
  cursor: pointer; font-size: 0.8rem; transition: all 0.15s; white-space: nowrap;
}
.pill-group button.active { background: var(--accent); color: #fff; }
.pill-group button:hover:not(.active) { background: var(--border); color: var(--text); }
select.ctrl {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 10px; color: var(--text); font-size: 0.85rem; outline: none; cursor: pointer;
}
.count-badge {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 12px; font-size: 0.8rem; color: var(--muted); white-space: nowrap; margin-left: auto;
}

/* Author bar */
.author-bar { display: none; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; gap: 8px; align-items: center; flex-wrap: wrap; }
.author-bar.show { display: flex; }
.author-bar label { font-size: 0.8rem; color: var(--muted); }
.author-bar input {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; color: var(--text); font-size: 0.85rem; outline: none; width: 200px;
}
.author-bar input:focus { border-color: var(--accent); }
.popular-authors { display: flex; gap: 6px; flex-wrap: wrap; }
.author-chip {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
  padding: 4px 10px; font-size: 0.75rem; cursor: pointer; color: var(--muted); transition: all 0.15s;
}
.author-chip:hover, .author-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
.story-list { display: flex; flex-direction: column; gap: 12px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color 0.2s; }
.card:hover { border-color: var(--accent); }
.card-header { padding: 14px 16px; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; }
.score-box { background: var(--surface2); border-radius: 6px; padding: 6px 10px; text-align: center; min-width: 54px; flex-shrink: 0; }
.score-box .num { font-size: 1.1rem; font-weight: bold; line-height: 1; }
.score-box .lbl { font-size: 0.62rem; color: var(--dim); margin-top: 2px; }
.gold { color: var(--gold); }
.green { color: var(--green); }
.card-meta { flex: 1; min-width: 0; }
.card-title { font-size: 1rem; color: #fff; line-height: 1.4; margin-bottom: 6px; }
.card-info { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.75rem; color: var(--muted); font-family: monospace; }
.card-info .author { color: var(--accent2); cursor: pointer; }
.card-info .author:hover { text-decoration: underline; }
.flair-tag { background: var(--surface2); border-radius: 3px; padding: 1px 6px; font-size: 0.7rem; }
.chevron { color: var(--dim); font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; transition: transform 0.2s; }
.card.open .chevron { transform: rotate(180deg); }

.story-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
.card.open .story-body { display: block; }
.story-text {
  margin-top: 14px; font-size: 0.93rem; line-height: 1.85; color: #ccc;
  white-space: pre-wrap; word-break: break-word; max-height: 65vh; overflow-y: auto; padding-right: 6px;
}
.story-text::-webkit-scrollbar { width: 4px; }
.story-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.story-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.btn { padding: 6px 14px; border-radius: 5px; border: none; cursor: pointer; font-size: 0.8rem; transition: all 0.15s; font-family: Georgia, serif; }
.btn-reddit { background: #ff4500; color: #fff; text-decoration: none; display: inline-flex; align-items: center; }
.btn-reddit:hover { background: #e03d00; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent2); }

.state-msg { text-align: center; padding: 56px 20px; color: var(--muted); }
.state-msg .icon { font-size: 2.8rem; margin-bottom: 12px; }
.state-msg p { font-size: 0.9rem; }

.load-more { text-align: center; margin-top: 24px; }
.load-more button {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 10px 28px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
  font-family: Georgia, serif; transition: all 0.2s;
}
.load-more button:hover { border-color: var(--accent); color: var(--accent2); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 600px) {
  header { padding: 12px 16px; }
  .finder-panel, .browse-panel { padding: 10px 16px; }
  .card-header { gap: 10px; }
  .score-box { min-width: 44px; padding: 4px 6px; }
}
</style>
</head>
<body>

<header>
  <div style="font-size:1.8rem">💀</div>
  <div>
    <h1>Tales From <span>The Creeps</span></h1>
    <div class="header-sub">r/TalesFromTheCreeps · story finder</div>
  </div>
</header>

<div class="mode-tabs">
  <div class="mode-tab active" id="tab-finder" onclick="setMode('finder')">🎙️ Episode Finder</div>
  <div class="mode-tab" id="tab-browse" onclick="setMode('browse')">📚 Browse</div>
  <div class="mode-tab" id="tab-authors" onclick="setMode('authors')">👤 CC Authors</div>
</div>

<!-- Episode Finder -->
<div class="finder-panel" id="finderPanel">
  <div>
    <div class="finder-label">SELECT A CREEPCAST EPISODE</div>
    <select id="episodeSelect">
      <option value="">Loading episodes…</option>
    </select>
  </div>
  <div class="finder-row">
    <div>
      <div class="finder-label">MINIMUM STORY LENGTH</div>
      <select id="finderLen">
        <option value="0">Any length</option>
        <option value="1500">Medium (1500+ chars)</option>
        <option value="2500" selected>Long (2500+ chars)</option>
        <option value="3500">Epic (3500+ chars)</option>
      </select>
    </div>
    <div>
      <div class="finder-label">RESULTS</div>
      <select id="finderCount">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
      </select>
    </div>
    <div style="margin-top:20px">
      <button id="findBtn" onclick="runFinder()" disabled>Find Stories</button>
    </div>
    <div class="count-badge" id="countBadge" style="margin-top:20px"></div>
  </div>
</div>

<!-- Authors -->
<div class="authors-panel hidden" id="authorsPanel">
  <div class="search-wrap">
    <input type="text" id="authorSearch" placeholder="Search authors…" oninput="renderAuthors()">
  </div>
  <div class="count-badge" id="authorsCount"></div>
</div>

<!-- Browse -->
<div class="browse-panel hidden" id="browsePanel">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search titles…" oninput="onFilter()">
  </div>
  <div class="pill-group">
    <button class="active" onclick="setSort('score',this)">⭐ Top Rated</button>
    <button onclick="setSort('recent',this)">🕐 Recent</button>
  </div>
  <select class="ctrl" id="browseLen" onchange="onFilter()">
    <option value="0">Any length</option>
    <option value="1500">Medium (1500+ chars)</option>
    <option value="2500" selected>Long (2500+ chars)</option>
    <option value="3500">Epic (3500+ chars)</option>
  </select>
  <button class="pill-group" style="border:1px solid var(--border);border-radius:6px;padding:0;" onclick="toggleAuthorBar()">
    <button style="background:none;border:none;color:var(--muted);padding:8px 12px;cursor:pointer;font-size:0.8rem;">👤 Author</button>
  </button>
  <div class="count-badge" id="browseCount">Loading…</div>
</div>

<div class="author-bar" id="authorBar">
  <label>Filter by author:</label>
  <input type="text" id="authorInput" placeholder="e.g. ChristianWallis" oninput="onFilter()">
  <div class="popular-authors" id="popularAuthors"></div>
</div>

<main>
  <div class="state-msg" id="stateMsg">
    <div class="icon">🎙️</div>
    <p>Select a CreepCast episode above to find matching stories.</p>
  </div>
  <div class="story-list" id="storyList"></div>
  <div class="load-more" id="loadMore" style="display:none">
    <button onclick="showMore()">Load more</button>
  </div>
  <div class="author-list" id="authorList" style="display:none"></div>
</main>

<script>
let stories = [];
let storyEmbs = null;
let episodeEmbs = null;
let episodes = [];
let ccAuthors = {};      // { username: { episodes: [...], stories: [...] } }
let filtered = [];
let browseSort = 'score';
let browsePage = 0;
let authorBarOpen = false;
let currentMode = 'finder';
const DIM = 384;
const PAGE = 30;

async function loadAll() {
  const [sRes, eRes, seRes, eeRes, caRes] = await Promise.all([
    fetch('data/stories.json'),
    fetch('data/episodes.json'),
    fetch('data/embeddings.bin'),
    fetch('data/episode_embeddings.bin'),
    fetch('data/cc_authors.json'),
  ]);
  stories     = await sRes.json();
  episodes    = await eRes.json();
  storyEmbs   = new Float32Array(await seRes.arrayBuffer());
  episodeEmbs = new Float32Array(await eeRes.arrayBuffer());
  ccAuthors   = await caRes.json();

  populateEpisodes();
  buildAuthorChips();
  document.getElementById('findBtn').disabled = false;
  document.getElementById('browseCount').textContent = stories.length.toLocaleString() + ' stories';
  document.getElementById('authorsCount').textContent = Object.keys(ccAuthors).length + ' authors';
  onFilter();
}

function populateEpisodes() {
  const sel = document.getElementById('episodeSelect');
  sel.innerHTML = '<option value="">— choose an episode —</option>';
  episodes.forEach((ep, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = ep.title || `Episode ${i+1}`;
    sel.appendChild(opt);
  });
}

// ── Finder ──
function runFinder() {
  const idx = parseInt(document.getElementById('episodeSelect').value);
  if (isNaN(idx)) { alert('Please select an episode first.'); return; }
  const minLen = parseInt(document.getElementById('finderLen').value) || 0;
  const topN   = parseInt(document.getElementById('finderCount').value) || 20;
  const qVec   = episodeEmbs.subarray(idx * DIM, (idx + 1) * DIM);

  const scores = [];
  for (let i = 0; i < stories.length; i++) {
    if (minLen && stories[i].text.length < minLen) continue;
    let dot = 0, off = i * DIM;
    for (let d = 0; d < DIM; d++) dot += qVec[d] * storyEmbs[off + d];
    scores.push({ i, sim: dot });
  }
  scores.sort((a, b) => b.sim - a.sim);
  const top = scores.slice(0, topN);
  document.getElementById('countBadge').textContent = `${top.length} matches`;
  renderCards(top.map(({ i, sim }) => ({ story: stories[i], sim })));
}

// ── Browse ──
function onFilter() {
  if (currentMode !== 'browse') return;
  const q      = document.getElementById('searchInput').value.trim().toLowerCase();
  const author = document.getElementById('authorInput').value.trim().toLowerCase();
  const minLen = parseInt(document.getElementById('browseLen').value) || 0;

  filtered = stories.filter(s => {
    if (minLen && s.text.length < minLen) return false;
    if (author && !s.author.toLowerCase().includes(author)) return false;
    if (q && !s.title.toLowerCase().includes(q)) return false;
    return true;
  });

  if (browseSort === 'score') filtered.sort((a, b) => b.score - a.score);
  else filtered.sort((a, b) => b.created_utc - a.created_utc);

  browsePage = 0;
  document.getElementById('browseCount').textContent = filtered.length.toLocaleString() + ' stories';
  renderCards(filtered.slice(0, PAGE).map(s => ({ story: s, sim: null })));
  browsePage = 1;
  document.getElementById('loadMore').style.display = filtered.length > PAGE ? 'block' : 'none';
}

function showMore() {
  const slice = filtered.slice(browsePage * PAGE, (browsePage + 1) * PAGE);
  slice.forEach(s => document.getElementById('storyList').appendChild(makeCard(s, null)));
  browsePage++;
  document.getElementById('loadMore').style.display = browsePage * PAGE < filtered.length ? 'block' : 'none';
}

function setSort(mode, btn) {
  browseSort = mode;
  document.querySelectorAll('.pill-group button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  onFilter();
}

function toggleAuthorBar() {
  authorBarOpen = !authorBarOpen;
  document.getElementById('authorBar').classList.toggle('show', authorBarOpen);
}

function filterByAuthor(author, e) {
  e.stopPropagation();
  setMode('browse');
  document.getElementById('authorInput').value = author;
  authorBarOpen = true;
  document.getElementById('authorBar').classList.add('show');
  document.querySelectorAll('.author-chip').forEach(c => c.classList.toggle('active', c.textContent === author));
  onFilter();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildAuthorChips() {
  const counts = {};
  stories.forEach(s => { counts[s.author] = (counts[s.author] || 0) + 1; });
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8).map(e => e[0]);
  const featured = ['ChristianWallis', ...top.filter(a => a !== 'ChristianWallis')].slice(0, 8);
  const container = document.getElementById('popularAuthors');
  featured.forEach(author => {
    if (!stories.find(s => s.author === author)) return;
    const chip = document.createElement('span');
    chip.className = 'author-chip';
    chip.textContent = author;
    chip.onclick = () => {
      document.getElementById('authorInput').value = author;
      document.querySelectorAll('.author-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      onFilter();
    };
    container.appendChild(chip);
  });
}

// ── Authors tab ──
function renderAuthors() {
  const q = (document.getElementById('authorSearch').value || '').trim().toLowerCase();
  const list = document.getElementById('authorList');
  list.innerHTML = '';

  // Sort: most TFTC stories first, then most CC episodes
  const sorted = Object.entries(ccAuthors).sort((a, b) => {
    const diff = b[1].stories.length - a[1].stories.length;
    return diff !== 0 ? diff : b[1].episodes.length - a[1].episodes.length;
  });

  const visible = q ? sorted.filter(([u]) => u.toLowerCase().includes(q)) : sorted;
  document.getElementById('authorsCount').textContent = visible.length + ' of ' + sorted.length + ' authors';

  visible.forEach(([username, data]) => {
    list.appendChild(makeAuthorCard(username, data));
  });
}

function makeAuthorCard(username, data) {
  const hasStories = data.stories.length > 0;
  const card = document.createElement('div');
  card.className = 'author-card';
  const episodeSample = data.episodes.slice(0, 3).join(', ') + (data.episodes.length > 3 ? '…' : '');

  const storiesHtml = hasStories
    ? data.stories.map(s => storyInnerHTML(s, null, false)).map(html => {
        const d = document.createElement('div');
        d.className = 'card';
        d.style.cssText = 'margin:10px 16px;border-radius:6px;';
        d.innerHTML = html;
        return d.outerHTML;
      }).join('')
    : `<div class="no-stories-msg">This author posted their stories on other subreddits (like r/nosleep) rather than r/TalesFromTheCreeps.</div>`;

  card.innerHTML = `
    <div class="author-card-header" onclick="this.closest('.author-card').classList.toggle('open')">
      <div class="author-avatar ${hasStories ? 'has-stories' : ''}">${esc(username[0].toUpperCase())}</div>
      <div class="author-card-meta">
        <div class="author-name">u/${esc(username)}</div>
        <div class="author-badges">
          <span class="badge badge-ep">🎙️ ${data.episodes.length} episode${data.episodes.length !== 1 ? 's' : ''}</span>
          ${hasStories
            ? `<span class="badge badge-stories">📖 ${data.stories.length} r/TFTC post${data.stories.length !== 1 ? 's' : ''}</span>`
            : `<span class="badge badge-none">No r/TFTC posts</span>`}
        </div>
        <div class="episode-list">${esc(episodeSample)}</div>
      </div>
      <div class="chevron">▼</div>
    </div>
    <div class="author-stories">${storiesHtml}</div>`;
  return card;
}

// ── Mode switching ──
function setMode(mode) {
  currentMode = mode;
  ['finder','browse','authors'].forEach(m => {
    document.getElementById('tab-' + m).classList.toggle('active', mode === m);
  });
  document.getElementById('finderPanel').classList.toggle('hidden', mode !== 'finder');
  document.getElementById('browsePanel').classList.toggle('hidden', mode !== 'browse');
  document.getElementById('authorsPanel').classList.toggle('hidden', mode !== 'authors');
  document.getElementById('authorBar').classList.toggle('hidden', mode !== 'browse');

  document.getElementById('storyList').style.display  = mode === 'authors' ? 'none' : '';
  document.getElementById('loadMore').style.display   = mode === 'authors' ? 'none' : (mode === 'browse' && filtered.length > PAGE ? 'block' : 'none');
  document.getElementById('authorList').style.display = mode === 'authors' ? '' : 'none';

  if (mode === 'finder') {
    document.getElementById('stateMsg').style.display = 'block';
    document.getElementById('stateMsg').innerHTML = '<div class="icon">🎙️</div><p>Select a CreepCast episode above to find matching stories.</p>';
    document.getElementById('storyList').innerHTML = '';
    document.getElementById('countBadge').textContent = '';
  } else if (mode === 'browse') {
    document.getElementById('stateMsg').style.display = 'none';
    if (filtered.length === 0) onFilter();
  } else if (mode === 'authors') {
    document.getElementById('stateMsg').style.display = 'none';
    if (document.getElementById('authorList').children.length === 0) renderAuthors();
  }
}

// ── Render (finder + browse) ──
function renderCards(items) {
  const list = document.getElementById('storyList');
  list.innerHTML = '';
  document.getElementById('stateMsg').style.display = items.length ? 'none' : 'block';
  if (!items.length) {
    document.getElementById('stateMsg').innerHTML = '<div class="icon">🕯️</div><p>No stories found. Try adjusting the filters.</p>';
    return;
  }
  items.forEach(({ story, sim }) => list.appendChild(makeCard(story, sim)));
  document.getElementById('loadMore').style.display = 'none';
}

function makeCard(s, sim) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = storyInnerHTML(s, sim, true);
  return card;
}

// Shared inner HTML for story cards.
// withAuthor=true adds a clickable author span (browse/finder); false omits it (author tab).
function storyInnerHTML(s, sim, withAuthor) {
  const date = new Date(s.created_utc * 1000).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  const wc = s.word_count >= 1000 ? (s.word_count / 1000).toFixed(1) + 'k' : s.word_count;
  const scoreHtml = sim !== null
    ? `<div class="score-box"><div class="num green">${Math.round(sim * 100)}%</div><div class="lbl">match</div></div>`
    : `<div class="score-box"><div class="num gold">${s.score}</div><div class="lbl">points</div></div>`;
  const authorHtml = withAuthor
    ? `<span class="author" onclick="filterByAuthor('${esc(s.author)}',event)">u/${esc(s.author)}</span>`
    : '';
  return `
    <div class="card-header" onclick="this.closest('.card').classList.toggle('open')">
      ${scoreHtml}
      <div class="card-meta">
        <div class="card-title">${esc(s.title)}</div>
        <div class="card-info">
          ${authorHtml}
          <span>📅 ${date}</span>
          <span>📖 ${wc} words</span>
          <span>💬 ${s.num_comments}</span>
          ${s.flair ? `<span class="flair-tag">${esc(s.flair)}</span>` : ''}
        </div>
      </div>
      <div class="chevron">▼</div>
    </div>
    <div class="story-body">
      <div class="story-text">${esc(s.text)}</div>
      <div class="story-actions">
        <a href="${esc(s.url)}" target="_blank" class="btn btn-reddit">View on Reddit ↗</a>
        ${withAuthor ? `<button class="btn btn-secondary" onclick="filterByAuthor('${esc(s.author)}',event)">More by u/${esc(s.author)}</button>` : ''}
      </div>
    </div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadAll();
</script>
